version: 1
map_type: feature_map
owner: bricks
last_updated: 2026-07-03
purpose: >
  为人类测试员和 AI 测试员提供产品功能清单与进入路径，作为回归测试与变更影响评估的入口索引。

products:
  - product_id: puzzle_pack_maker
    name: Puzzle Pack Maker
    platform:
      - flutter_mobile
      - flutter_web
    entry_points:
      - path: apps/puzzle_pack_maker/lib/main.dart
        route: App root
      - path: https://craft.bricks.cool/puzzle-pack-maker
        route: Production web subpath
    features:
      - feature_id: puzzle_pack_maker_shell
        name: Puzzle Pack Maker 登录后三 Tab 壳
        user_value: 用户可在独立 Puzzle Pack Maker app 中通过 GitHub 登录，并进入 Create/Gallery/Library 三 tab 初始页面。
        entry_paths:
          - screen: PuzzlePackMakerApp startup router
            route_hint: apps/puzzle_pack_maker/lib/app/puzzle_pack_maker_app.dart
          - screen: LoginScreen
            route_hint: apps/puzzle_pack_maker/lib/features/auth/login_screen.dart
          - screen: PuzzlePackHomeScreen
            route_hint: apps/puzzle_pack_maker/lib/features/home/puzzle_pack_home_screen.dart
          - service: Puzzle Pack Maker OAuth helpers
            route_hint: apps/puzzle_pack_maker/lib/features/auth/
          - route: GitHub OAuth native return allowlist
            route_hint: apps/node_backend/src/routes/auth_return_to.ts
          - route: Static subpath host fallback
            route_hint: apps/node_backend/src/app.ts
          - deployment: Web build copied to /puzzle-pack-maker
            route_hint: tools/vercel-build.sh
        smoke_checks:
          - 访问 `https://craft.bricks.cool/puzzle-pack-maker` 时加载 Puzzle Pack Maker web app，而不是根路径 Bricks chat app。
          - 未登录用户看到 Puzzle Pack Maker 登录页和 `Continue with GitHub` 按钮。
          - Web 登录从 `/api/auth/github?return_to=<current puzzle-pack-maker URL>` 发起，完成后回到 `/puzzle-pack-maker`。
          - iOS 登录使用 `puzzlepackmaker://auth/github/callback` 回到独立 app。
          - 登录后底部显示 `Create`、`Gallery`、`Library` 三个 tab。
          - 切换三个 tab 时分别显示对应 Hello World 内容。
          - 根路径 `https://craft.bricks.cool` 仍加载原 Bricks web app。

  - product_id: mobile_chat_app
    name: Mobile Chat App
    platform:
      - flutter_mobile
      - flutter_web
    entry_points:
      - path: apps/mobile_chat_app/lib/main.dart
        route: App root
    features:
      - feature_id: auth_login
        name: GitHub OAuth 登录
        user_value: 用户可完成登录并进入应用。
        entry_paths:
          - screen: LoginScreen
            route_hint: apps/mobile_chat_app/lib/features/auth/login_screen.dart
          - service: GitHubOAuth/AuthService
            route_hint: apps/mobile_chat_app/lib/features/auth/
        smoke_checks:
          - Web 打开登录页并发起 GitHub 登录。
          - iOS release 点击 GitHub 登录时默认应打开 `https://bricks.askman.dev` 上的后端 OAuth 授权页。
          - iOS debug 真机包在没有显式 `BRICKS_API_BASE_URL` 时，也应默认使用 `https://bricks.askman.dev`，避免手机把 `localhost` 当成本机。
          - iOS OAuth 完成后通过 `bricks://auth/github/callback` 回到应用。
          - 完成 token 回调后进入主界面。

      - feature_id: chat_session
        name: 多 Agent 聊天会话
        user_value: 用户可在会话中发送消息并观察 Agent 协同回复。
        entry_paths:
          - screen: ChatScreen
            route_hint: apps/mobile_chat_app/lib/features/chat/chat_screen.dart
          - navigation: ChatNavigationPage
            route_hint: apps/mobile_chat_app/lib/features/chat/chat_navigation_page.dart
        smoke_checks:
          - 发送一条消息后可以看到消息列表更新。
          - 发送消息后输入框应保持可输入并恢复焦点，流式回复期间仍可继续编辑下一条草稿。
          - 输入框内按 `Shift+Enter` 插入换行且不发送；普通 `Enter` 仍发送当前草稿。
          - 宽屏内联 Navigation 打开时，拖动右侧分隔手柄应能在最小/最大宽度范围内调整侧边栏宽度。
          - 宽屏内联 Navigation 打开时，Navigation 与 chat 区域之间应显示一条可拖拽的垂直分界线。
          - 将路由切到 plugin/OpenClaw 节点后发送消息，在插件离线时应呈现“已发送但未完成（未读）”。
          - 启动并配置 openclaw 插件后再次发送，消息应完成并出现 assistant 回复。
          - 当用户拥有多个 OpenClaw 节点时，输入框左侧路由菜单应仅列出真实节点；菜单主标题显示节点名称，副标题显示 `OpenClaw`。
          - 当已保存的 OpenClaw `nodeId` 对应节点已被删除时，聊天页与发送行为应回退到 `Bricks Default`，而不是改投递到其他 OpenClaw 节点。
          - 在聊天页选择某个 OpenClaw 节点后发送消息时，仅所选节点应收到并回复；同用户其他节点不应重复消费同一条消息。
          - 从设置页新增或重命名节点后返回聊天页，路由菜单中的 OpenClaw 节点列表应刷新为最新状态。
          - 在 OpenClaw 插件离线后切回本地 Bricks Default 路由继续发送时，历史消息应优先按服务端 seqId（不可变插入序）渲染，后到达更新不会打乱对话先后。
          - 当多条消息 createdAt 相同（秒级碰撞）时，消息应按 seqId 稳定从旧到新渲染。
          - 当 writeSeq 因更新语义与原始对话顺序冲突时，列表仍应按 seqId 保持“先问后答”。
          - local 与 plugin 路由均通过 `/api/chat/respond` 先入库 user query 并返回 async accepted，再由后台异步写入 assistant 回复。
          - 发送后 user query 仍先显示“已接受”状态；assistant 身份占位可在 SSE dispatch 占位到达时提前出现，但 assistant 正文气泡仍应等待真实内容开始到达。
          - Agent tool 结果可通过 message metadata 的 typed invalidations 驱动前端局部刷新；普通对话完成不应全量请求 scopes/channels/scope-settings。
          - user query 气泡应显示两段状态：入库后先显示第一枚 ✓；AI 开始回复后显示第二枚状态，local/其他远端为第二枚 ✓，OpenClaw plugin 为单色路由状态图标。
          - user query 的时间/线程与投递状态应显示在气泡内；长按气泡可弹出“复制/分叉（待开发）/重发（待开发）”菜单，并在底部显示 message id 与 task id。
          - 发送消息后，user query 由后端 /respond 端点统一持久化；前端不执行独立入库请求。
          - 发送消息后，最新 user 消息会定位在可见区域首条，assistant 回复显示在其后。
          - 打开或切换到已有历史的会话后，列表按“最新 user 消息优先”定位而非强制到底部。
          - 初始进入已有历史会话时，客户端只加载最后 20 条消息；若其中存在 user 消息，应定位到这批消息里的最后一条 user，且其后的 assistant/tool/status 行继续显示。
          - 初始 20 条历史里没有 user 消息时，列表应自然显示最后内容到底部，不额外留出等待 AI 回复的偏移空间。
          - 当用户正在阅读旧回复且当前视野没有看到最新回复结尾时，发送追问不应改变当前阅读位置；若用户已经读到最新回复结尾，发送追问应重新把新 user 消息顶到可见区域上方。
          - 当向上浏览历史消息后，输入框上方应出现向下箭头按钮；点击后应快速跳转到最新消息。
          - 刷新页面后，已发送过消息的频道仍会在侧边栏中显示并可继续会话。
          - 新建频道时必须输入频道名，且重复名称会被拦截。
          - 新建频道确认后，即使还没有发送消息，刷新页面后侧边栏仍应从 `chat_channels` 恢复该频道名称。
          - Navigation 的 Channels tab 创建按钮显示为 `New Channel`。
          - 默认频道显示为 `Default Channel`。
          - Navigation 的 Channels tab 列表项不显示 leading 图标；长按频道菜单显示 `Rename` / `Archive`。
          - 长按非默认频道会出现 `Rename` / `Archive` 菜单；归档后频道从列表中隐藏。
          - 长按频道改名后刷新页面，频道名称应保持为用户设置值（由数据库映射恢复）。
          - 侧边栏频道列表与顶部频道下拉菜单均按最新消息时间降序排列；有消息记录的频道排在无消息频道前面；默认频道参与排序，不固定置顶；时间相同时按 id 字典序确定顺序。
          - 顶部标题显示当前频道名且左对齐。
          - iOS/Android 登录完成后，聊天初始化不应因本地 Agents 目录不支持而失败，且应继续加载该账号的历史会话。
          - iOS 启动聊天初始化时，本地 Agents 目录应从 app sandbox 路径解析，不依赖 `HOME` 环境变量。
          - 本地自定义 Agent 文件读取失败时，应回退为仅使用内建 Agent，并继续加载线上频道与历史消息。
          - 切换 Agent 后仍可继续会话。
          - 首次安装且未创建自定义 Agent 时，侧边栏 Agents 分组应默认显示内建 Agent 列表（不为空）。
          - 侧边栏应在 Agents 分组上方显示 Skills 分组；当前内容为空并显示“待实现”占位。
          - 深色紧凑布局下侧边栏应使用黑色背景并展开为全屏宽度；深色宽屏布局下侧边栏应使用黑色背景并固定为约 260px 宽，与主聊天画布形成层级色差。
          - 宽屏下点击左上角导航按钮后，侧边导航应以内联侧栏展开并与右侧对话区共存；再次点击后侧栏隐藏。
          - 宽屏内联侧栏中点击频道应切换会话但保持侧栏打开；窄屏抽屉中点击频道仍应切换会话并关闭抽屉。
          - 侧边栏 Agents 列表中，内建 Agent 需显示只读标识，自定义 Agent 可显示自定义描述。
          - 侧边栏 Agents 分组标题右侧不应出现“配置”按钮。
          - 点击任一侧边栏 Agent 后应进入 Prompt 详情页，且底部应提供“修改配置”“发起对话”两个按钮。
          - 在 Prompt 详情页点击“修改配置”后，应进入 Agent 管理流程。
          - 在 Prompt 详情页点击“发起对话”后，应将该 Agent 设为当前会话 Agent。
          - 输入框不再支持 `@agent` 文本补全；当路由为 local/Bricks Default 时，`@` 按钮显示在路由按钮右侧、配置按钮左侧，点击后下拉展示与侧边栏 Agents 分组一致的 Agent 列表。
          - 当路由为 OpenClaw 时，`@` 按钮同样可点击并弹出下拉菜单；菜单应展示匹配 OpenClaw node 上报的 agents，选择后将 `@agentId` 插入输入框。
          - 对话页顶部不再显示横向“参与者/Agent 概率”指示条。
          - 从输入框左下角菜单点击 `Info` 后可看到调试信息弹窗。
          - 当路由为 local/Bricks Default 时，输入框左下角应显示配置按钮，且 `Model` 项副标题展示当前生效模型名。
          - 当路由为 OpenClaw 时，输入框左下角应额外出现 `/` 斜杠命令按钮，选择命令后应自动填充到输入框。
          - 未来新增的 plugin 平台（例如 Hermes）应复用 plugin 路由，平台差异留在 node/plugin 配置层。
          - 顶部频道名称应支持下拉切换频道，切换后分区标签与分区列表需同步刷新为目标频道的数据。
          - AI tool 创建 thread 或改名当前 channel 后，客户端应通过同步 scopes/channels 刷新顶部名称与 Thread 列表，不需要整页刷新。
          - 非主 Thread 首次收到用户消息时，后端应先在 `chat_channels` 写入 `source=first_message_exact` 的可读名；本轮 assistant 成功完成后仅尝试一次 `first_message_generated`，成功或 fallback 后通过 typed invalidation 刷新 Thread 名称。
          - 顶部频道下拉菜单顶部应显示 `Rename` / `Archive` 功能分组；默认频道下这两个功能禁用，非默认频道下应调用频道改名与归档持久化路径；频道很多时菜单应限制在合理最大高度内并支持内部滚动。
          - 频道名称右侧应内嵌分区下拉按钮（显示当前分区名+下箭头），且该菜单与频道标题左对齐，不再使用右上角三个点。
          - Thread 菜单主线程显示为 `Thread`；菜单应先显示 `New Thread` 功能组；在子线程内应显示小号浅色“当前组”标题及 `Rename` / `Archive` 操作；主线程不显示当前组操作；底部列表组显示主线程和已有子线程；菜单弹出动画应保持快速缩放+淡入。
          - 子区选择 `Rename` 后应弹出分区名输入框，空名称和重复名称会被拦截，保存后顶部子区标题和列表项同步更新，刷新后仍从后端命名映射恢复。
          - 在主区（channel 对话）打开路由菜单时，不应显示 Thread router 分组；在子区（thread 对话）应显示 Follow channel / Bricks Default / OpenClaw 三项。
          - Openclaw 异步会话空闲时，客户端应通过 SSE（`/api/chat/events/:sessionId`）保持持久推送连接，服务端将在新消息到达后实时推送事件，无需客户端反复轮询。
          - 深色主题下应采用低亮度灰阶 surface；用户消息气泡不得使用品牌 primary 色。
          - 深色紧凑布局应呈现“黑色页面背景 + 近黑输入框”的层级；深色宽屏布局应呈现“近黑页面背景 + elevated 输入框”的层级。
          - 对话输入框获得焦点时不应切换为高亮边框，应保持与未聚焦状态一致的安静边框。
          - Markdown/code 内容块应保持 embedded/recessed surface 层级，而不是使用输入框的 elevated surface。
          - 输入框底部动作按钮默认应为白灰层级；发送按钮仅在输入非空时进入高亮激活态。
          - 输入框底部可点击且非禁用的动作按钮（路由、`/`、`@`、配置、发送）应使用一致的白色系 enabled 颜色，除非该状态刻意使用 accent。
          - OpenClaw plugin 路由与投递状态图标应使用单色图标，不使用彩色 emoji。
          - 用户消息与 assistant 消息正文应共享同一文本样式基线（字号一致）；时间/thread 等 meta 信息应统一为次级灰。

      - feature_id: chat_media_attachments
        name: 频道内图片附件、生成图片与生成视频持久化
        user_value: 用户可在聊天中上传图片，上传中/失败时能看到草稿缩略图与重试/移除操作，刷新后仍能预览/下载；Gemini 路由会把上传图片作为多模态输入读取；AI 生成图片和 Veo 生成视频可作为频道内持久附件保存，供同一频道 workspace/Agent 访问。
        entry_paths:
          - screen: ChatScreen composer image action
            route_hint: apps/mobile_chat_app/lib/features/chat/chat_screen.dart
          - widget: ComposerBar attachment strip
            route_hint: apps/mobile_chat_app/lib/features/chat/widgets/composer_bar.dart
          - widget: ComposerBar web clipboard image paste handler
            route_hint: apps/mobile_chat_app/lib/features/chat/widgets/composer_paste_image_web.dart
          - widget: MessageList media attachment rendering
            route_hint: apps/mobile_chat_app/lib/features/chat/widgets/message_list.dart
          - service: ChatHistoryApiService.uploadImage/respond mediaAttachmentIds
            route_hint: apps/mobile_chat_app/lib/features/chat/chat_history_api_service.dart
          - route: POST /api/media/uploads
            route_hint: apps/node_backend/src/routes/media.ts
          - route: POST /api/media/generated-images
            route_hint: apps/node_backend/src/routes/media.ts
          - route: POST /api/media/image-generations
            route_hint: apps/node_backend/src/routes/media.ts
          - route: POST /api/media/video-generations
            route_hint: apps/node_backend/src/routes/media.ts
          - route: GET|POST /api/media/generation-jobs/:jobId
            route_hint: apps/node_backend/src/routes/media.ts
          - route: GET /api/media/:mediaId/preview|content|download
            route_hint: apps/node_backend/src/routes/media.ts
          - service: Gemini media generation provider integration
            route_hint: apps/node_backend/src/services/mediaGenerationService.ts
          - tool: media_image_generate / media_video_generate
            route_hint: apps/node_backend/src/services/localAgentLoopService.ts
          - llm: Gemini multimodal image parts
            route_hint: apps/node_backend/src/routes/chat.ts
        smoke_checks:
          - 选择图片后，输入框上方立即显示本地缩略图与上传进度；失败后保留缩略图并提供重试和移除。
          - 在输入框聚焦时粘贴剪贴板图片，应进入同一套上传中、失败重试、上传完成附件流程；若异步读取完成时 composer/page 已销毁，不应触发上传状态更新。
          - 上传成功后，输入框上方显示带 Authorization header 的 media preview，而不是只显示占位 icon。
          - 发送带图片的消息后，user 气泡显示图片附件并保持原有投递状态。
          - 点击/点按聊天图片附件会通过 primary pointer 打开全屏预览；Safari/Chrome 桌面浏览器均应可用，右上角关闭按钮返回聊天。
          - 长按或右键/两指点按聊天图片附件会显示 Download 菜单项；全屏预览右上角也提供 Download image 按钮，并通过带 Authorization 的下载请求保存图片。
          - Gemini/Google AI Studio 路由收到上传图片时，模型请求包含 text part 与 image part，能够基于图片内容回答。
          - 刷新或 SSE 同步后，图片附件仍从 message metadata 恢复并可加载预览。
          - 访问 media preview/content/download 路由必须携带当前用户 token；跨用户 media id 返回 404。
          - 数据库 `media_assets.channel_relative_path` 只保存频道内相对路径，不保存宿主机绝对路径。
          - 同一 channel 的上传图片写入该 channel 目录下 `media/uploads/`，生成图片写入 `media/generated/images/`，生成视频写入 `media/generated/videos/`。
          - "`POST /api/media/image-generations` 使用用户的 Google AI Studio 配置调用 Gemini Interactions API，并把返回图片保存成 `generated_image`。"
          - "AI 通过 `media_image_generate` 生成成功后，最终 assistant 消息 metadata 应包含 `mediaAttachments`，UI 显示真实预览而不是 `[image: ...]` 文本占位。"
          - "`POST /api/media/video-generations` 创建 `media_generation_jobs` 记录并保存 Veo operation name；轮询 job 完成后下载 provider video URI 并保存成 `generated_video`。"
          - Veo `referenceImages` 最多接受 3 张 ready image media；`lastFrameMediaId` 必须搭配 `firstFrameMediaId`。
          - 不支持的 MIME、空图片、超过 20MB 的图片、空视频或非 mp4 视频被后端拒绝。

      - feature_id: channel_react_site_workspace
        name: Channel React Site Workspace and Public Preview
        user_value: 用户可以让 Agent 在当前 channel 里创建、编辑、构建一个静态 React/Vite 网站，并通过固定 `craft-spaces.bricks.cool` 子域名访问最新成功构建。
        entry_paths:
          - migration: channel_sites public slug binding
            route_hint: apps/node_backend/src/db/migrations/028_create_channel_sites.sql
          - migration: channel site publish commit tracking
            route_hint: apps/node_backend/src/db/migrations/029_add_channel_site_publish_commits.sql
          - screen: ChatScreen title-bar site publish status
            route_hint: apps/mobile_chat_app/lib/features/chat/chat_screen.dart
          - service: Flutter site publish status API client
            route_hint: apps/mobile_chat_app/lib/features/chat/site_publish_api_service.dart
          - service: user-scoped channel filesystem paths
            route_hint: apps/node_backend/src/services/channelFileService.ts
          - service: persistent per-user sandbox filesystem and shell runner
            route_hint: apps/node_backend/src/services/userSandboxService.ts
          - service: same-host gVisor sandbox runner
            route_hint: apps/node_sandbox_runner/src/index.ts
          - ops: Vultr host sandbox runner installer
            route_hint: tools/sandbox_runner/install_vultr.sh
          - service: site workspace, starter, build, media copy
            route_hint: apps/node_backend/src/services/channelSiteService.ts
          - route: Host <slug>.craft-spaces.bricks.cool static site serving
            route_hint: apps/node_backend/src/routes/channelSiteHost.ts
          - route: /sites/<slug> preview path static site serving
            route_hint: apps/node_backend/src/routes/channelSiteHost.ts
          - route: authenticated site publish status API
            route_hint: apps/node_backend/src/routes/channelSiteApi.ts
          - tools: site_workspace_config/init, site_file_*, site_shell_exec, site_publish_status, site_build, site_media_copy
            route_hint: apps/node_backend/src/services/localAgentLoopService.ts
        smoke_checks:
          - "`site_workspace_init` initializes one Vite + React + TypeScript workspace for the current channel and creates an initial git commit."
          - Chat title bar shows a lightweight Site status pill; opening it shows the public URL, publish time, current commit, live commit, Visit, Share, Refresh, and Publish actions.
          - Channel filesystem directories are nested under one persistent per-user sandbox with opaque user and channel path segments, so raw user IDs and channel IDs are not exposed in paths.
          - Same-user channels share one sandbox filesystem root, while different users resolve to different sandbox roots.
          - "`site_file_write/read/list/mkdir/delete` operate only inside the current channel workspace and reject traversal paths."
          - "`site_shell_exec` and `site_build` execute through the user sandbox runner instead of direct host shell execution."
          - Production uses `BRICKS_SANDBOX_RUNNER=http` so the Bricks app is control plane only; user commands run in same-host gVisor containers managed by the sandbox runner.
          - Production and preview apps send `BRICKS_SANDBOX_RUNNER_ROOT_SEGMENTS=production,sandboxes` so the shared runner mounts the same workspace root while both environments share one database.
          - "`site_publish_status` reports the public URL, current git commit, last successful published commit, latest publish time, and commit-based unpublished update state."
          - "`site_build` creates a git snapshot commit, runs npm install/build, writes `jobs/build.log` and `jobs/build.json`, stores the latest publish commit, and only replaces `web/dist` plus `published_commit_sha` after a successful build."
          - "Starter Vite builds use a relative base so `/sites/<slug>` preview URLs load JS/CSS assets below the same site path."
          - "`site_media_copy` copies current-channel uploaded/generated media into `workspace/public/assets/` and returns a public asset path."
          - "Production requests to `<slug>.craft-spaces.bricks.cool` resolve through `channel_sites.public_slug`, serve the latest successful `web/dist`, apply React SPA fallback, and include `X-Robots-Tag: noindex`."
          - "Preview deployments set `BRICKS_PUBLIC_SITE_BASE_URL` so site tools return `https://<preview-host>/sites/<slug>` URLs that do not depend on the global `craft-spaces` wildcard origin certificate."
          - "Generated site responses override the main app CSP with a site-specific policy that allows common external HTTPS scripts, styles, fonts, media, workers, frames, and WebSocket connections."

