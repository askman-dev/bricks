  - product_id: node_backend
    name: Node Backend API
    platform:
      - nodejs
      - vercel
    entry_points:
      - path: apps/node_backend/src/index.ts
        route: API root
    features:
      - feature_id: backend_runtime
        name: Backend runtime bootstrap and local debug
        user_value: Developers can run the backend locally against selected database targets without unintentionally mutating schema.
        entry_paths:
          - app: Express app
            route_hint: apps/node_backend/src/app.ts
          - server: Node backend entrypoint
            route_hint: apps/node_backend/src/index.ts
        smoke_checks:
          - '`AUTO_MIGRATE=false` skips request-time migrations before `/api/health` and API routes.'
          - A local backend can run on a non-default port using `.env.local` while connecting to Turso via `TURSO_DATABASE_URL` and `TURSO_AUTH_TOKEN`.
          - Flutter web can target the local backend with `BRICKS_API_BASE_URL` and bypass OAuth with `BRICKS_TEST_TOKEN`.
          - Local manual model testing can set `LOCAL_LLM_CONFIG_ENABLED=true`, an explicit local/dev marker, and provider keys in `.env.local` so the local backend does not write provider tokens to cloud Turso; production ignores this fallback.
          - The channel New UI evidence harness can create a channel through the sidebar and capture UI/API/Turso checkpoints.
          - Evidence browser harnesses should record fixture user, API, direct database, immediate UI, and refresh checkpoints so failures can be localized.
          - The local manual AI test environment can run local Flutter Web and local API against cloud Turso, use `Quick Login (Test)`, and create a fixture-user Gemini config from `.env.local`.

      - feature_id: backend_auth
        name: 认证与回跳控制
        user_value: API 请求可被认证并处理回跳逻辑。
        entry_paths:
          - route: /api/auth/github
            route_hint: apps/node_backend/src/routes/auth.ts
          - route: /api/auth/github/callback
            route_hint: apps/node_backend/src/routes/auth.ts
          - route: /api/auth/me
            route_hint: apps/node_backend/src/routes/auth.ts
        smoke_checks:
          - 未登录请求返回预期状态码。
          - 合法回跳参数通过校验。
          - 仅允许受控 native OAuth callback，拒绝任意自定义 scheme 回跳。
          - legacy `/api` OAuth route mount 只应限流 OAuth anonymous endpoints，不得让已认证的 `/api/config?category=llm` 读请求误返回 anonymous auth 429。

      - feature_id: backend_chat_llm
        name: Chat 与 LLM 调用
        user_value: 服务端可处理聊天请求并路由到模型提供商，并向远端小龙虾/OpenClaw 提供 pull-only 平台接口。
        entry_paths:
          - route: /api/chat
            route_hint: apps/node_backend/src/routes/chat.ts
          - route: /api/llm
            route_hint: apps/node_backend/src/routes/llm.ts
          - route: /api/v1/platform/*
            route_hint: apps/node_backend/src/routes/platform.ts
          - route: /api/config/platform-token
            route_hint: apps/node_backend/src/routes/config.ts
          - service: LlmService
            route_hint: apps/node_backend/src/llm/llm_service.ts
        smoke_checks:
          - 调用 chat 接口时返回结构化响应。
          - provider 配置缺失时给出明确错误。
          - '使用 API Key + X-Bricks-Plugin-Id 可访问 /api/v1/platform/events 并获取 nextCursor。'
          - '使用 `/api/chat/scope-settings` 为 plugin 路由保存 nodeId 后，再读取应返回同一 nodeId；旧值 openclaw 仍应兼容解析。'
          - '`/api/chat/scope-settings` GET 应返回 resolvedTargetNodeId/resolvedTargetNodeName/resolvedTargetPluginId，便于 UI 展示继承或回退后的有效目标。'
          - '同一用户存在多个 OpenClaw 节点时，`/api/chat/respond` 为消息写入目标节点 metadata 后，仅目标 plugin 可从 `/api/v1/platform/events` 读到该消息。'
          - '非目标 plugin 对其他 plugin 创建的 assistant message 执行 PATCH 时，应返回 403。'
          - '/api/v1/platform/events/ack 禁止 body 中传 pluginId，合法 ACK 可重复调用并返回成功。'
          - '/api/config/nodes/:nodeId/agents?sourcePlatform=openclaw 在请求时即时执行 OpenClaw CLI 查询 agents，并用于 plugin 路由的 OpenClaw @ 下拉菜单。'
          - '调用 /api/chat/channels 可保存并读取每个用户的频道与 Thread 注册信息；调用 /api/chat/channels/archive 可归档并隐藏对应行。'
          - '使用 /api/config/nodes 创建多个节点后，不同节点的 token 应绑定不同 pluginId。'
          - '/api/v1/platform/messages 写入后，消息 metadata 应包含 nodeId/nodeName（当 pluginId 可映射到节点）。'
          - '高频访问 `/api/config?category=llm` 不应因应用层全局 IP 限流触发 429。'
          - '`/api/config` 写操作在同一用户维度超过每分钟预算时返回 429。'
          - '向 `/api/chat/scope-settings` PUT 保存 `instructions` 字段后，再通过 GET 读取应返回同一 instructions 值。'
          - '`/api/chat/respond` 在 body 包含 `systemPrompt` 且 DB 中存在 channel/thread instructions 时，发给模型的消息列表首条应为合并后的 system 消息。'

      - feature_id: scheduled_actions
        name: 定时 Agent 任务调度
        user_value: 用户可通过对话创建重复执行的 Agent 任务（如每日日程汇总、定时提醒），无需手动触发。
        entry_paths:
          - route: GET /api/cron/scheduled-actions
            route_hint: apps/node_backend/src/routes/cron.ts
          - service: scheduledActionService
            route_hint: apps/node_backend/src/services/scheduledActionService.ts
        smoke_checks:
          - 使用 CRON_SECRET 请求 `/api/cron/scheduled-actions` 返回 200 及 processed 列表。
          - 无 CRON_SECRET 或 token 错误时返回 401/403。
          - 通过 Agent 工具创建定时任务后，`scheduled_actions` 中可查到该记录。
          - 同一 fire time 的重复 cron 请求不会创建第二条 run 记录。

  - product_id: node_openclaw_plugin
    name: Node OpenClaw Plugin
    platform:
      - nodejs
    entry_points:
      - path: apps/node_openclaw_plugin/src/index.ts
        route: plugin runtime main
    features:
      - feature_id: node_openclaw_pull_loop
        name: OpenClaw Pull-only 插件运行时与 Onboarding 配置
        user_value: 远端插件可在 OpenClaw onboarding 中完成 channel 配置，并轮询 Bricks 平台事件执行 ACK 与消息回写闭环。
        entry_paths:
          - setup: onboarding.configureInteractive
            route_hint: apps/node_openclaw_plugin/src/openclawExtension.ts
          - manifest: channelConfigs.dev-askman-bricks
            route_hint: apps/node_openclaw_plugin/openclaw.plugin.json
          - runtime: NodeOpenClawPluginRunner
            route_hint: apps/node_openclaw_plugin/src/pluginRunner.ts
          - client: PlatformClient
            route_hint: apps/node_openclaw_plugin/src/platformClient.ts
          - state: FileStateStore
            route_hint: apps/node_openclaw_plugin/src/stateStore.ts
        smoke_checks:
          - 安装插件后执行 `openclaw onboard` 可提示输入 BRICKS_BASE_URL / BRICKS_PLUGIN_ID / BRICKS_PLATFORM_TOKEN 并写入 `channels.dev-askman-bricks`。
          - 设置 BRICKS_BASE_URL / BRICKS_PLATFORM_TOKEN / BRICKS_PLUGIN_ID 后可启动插件轮询。
          - 非 JWT token 或 claims 不完整时插件启动应失败（JWT-only）。
          - 插件可调用 `/api/v1/platform/events` 拉取事件并以 `X-Bricks-Plugin-Id` 发送请求。
          - 插件启动时可通过 `openclaw agents list --json` 抓取 OpenClaw agents 并上报到 Bricks platform。
          - 插件 ACK body 仅包含 `cursor` 与 `ackedEventIds` 且可推进本地 cursor。
          - 收到 `message.created` 事件后可执行 create + patch 消息回写。

  - product_id: docs_site
    name: Docusaurus Docs Site
    platform:
      - nodejs
      - docusaurus
      - vercel-static
    entry_points:
      - path: apps/docs_site/docusaurus.config.ts
        route: /docs/
      - path: vercel.json
        route: rewrite /docs/*
      - path: tools/vercel-build.sh
        route: build/web/docs artifact assembly
    features:
      - feature_id: docs_site_hosting
        name: Docusaurus 文档子路径挂载
        user_value: 用户可通过 `/docs/` 访问文档站点，并与 Flutter Web 主站共用同一域名部署。
        entry_paths:
          - route: /docs/
            route_hint: apps/docs_site/docusaurus.config.ts
          - route: /docs/:path*
            route_hint: vercel.json
        smoke_checks:
          - 执行 `DOCS_URL=http://localhost:3000 DOCS_BASE_URL=/docs/ npm run build` 后，docs 输出可被 `/docs/` 前缀访问。
          - 执行 `bash ./tools/vercel-build.sh` 后，`apps/mobile_chat_app/build/web/docs/index.html` 存在。
          - 本地静态服务访问 `/docs/` 呈现 Docusaurus 页面，访问 `/` 仍呈现 Flutter Web 首页。

  - product_id: dokku_deployment
    name: Dokku Deployment
    platform:
      - dokku
      - docker
      - github_actions
    entry_points:
      - path: Dockerfile
        route: Dokku Dockerfile deployment
      - path: .github/workflows/dokku_production_deploy.yml
        route: main branch production deploy
      - path: .github/workflows/dokku_preview_deploy.yml
        route: pull request preview deploy
      - path: docs/deploy/dokku.md
        route: deployment runbook
    features:
      - feature_id: dokku_channel_deployment
        name: Dokku 主站与 PR 预览部署
        user_value: main 分支自动部署到 `craft.bricks.cool`，PR 分支自动部署到独立预览域名；preview 与 production 共享数据库和 production sandbox workspace root。
        entry_paths:
          - route: https://craft.bricks.cool
            route_hint: .github/workflows/dokku_production_deploy.yml
          - route: https://<branch-slug>.craft-dev.bricks.cool
            route_hint: .github/workflows/dokku_preview_deploy.yml
          - mount: /app/data/sandboxes
            route_hint: Dockerfile
        smoke_checks:
          - main push 后 production app 重新部署并继续使用 `/home/bricks/data/production/sandboxes`。
          - PR open/synchronize 后创建或更新 `bricks-preview-<branch-slug>`，域名为 `<branch-slug>.craft-dev.bricks.cool`。
          - Dokku preview deploy 成功后发布 GitHub Deployment status，PR timeline 的 `View deployment` 按钮指向 preview 域名。
          - 每个 preview app mount 到 `/home/bricks/data/production/sandboxes`，并设置 `BRICKS_SANDBOX_RUNNER_ROOT_SEGMENTS=production,sandboxes`，与 production 共享 channel workspace 和 generated site build output。
          - Turso credentials, JWT signing secret, and encryption key stay in Dokku server config; preview apps copy them from the production app on the server instead of reading GitHub Actions secrets.
          - Production CSP must allow Flutter Web bootstrap scripts so `craft.bricks.cool` renders the login app instead of a blank page.
          - Flutter Web app shell files such as `index.html`, `main.dart.js`, `flutter.js`, and `flutter_service_worker.js` must return no-store/no-cache headers so preview deploys do not serve stale UI bundles.
          - PR close/merge 后对应 preview app 被 destroy；当 `DATA_ROOT=/home/bricks/data/production/sandboxes` 时 cleanup 必须保留共享 production data root。
          - GitHub OAuth callback 固定为 `https://craft.bricks.cool/api/callback`，preview 登录完成后可 redirect 回 preview 域名。
