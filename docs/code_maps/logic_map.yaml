    change_risks:
      - 本地直连线上 Turso 时若未设置 `AUTO_MIGRATE=false`，请求级迁移可能修改线上 schema 或因远端超时阻塞调试。
      - Flutter web 只能通过 dart-define 读取 `BRICKS_API_BASE_URL` 和 `BRICKS_TEST_TOKEN`，不能直接读取 shell `.env.local`。
      - 使用错误 `JWT_SECRET` 生成测试 token 会导致本地 API 返回 401。
      - 本地手测真实模型时应优先使用 `LOCAL_LLM_CONFIG_ENABLED=true`、显式本地运行标记（如 `BRICKS_LOCAL_DEV=true`）和 `.env.local` provider key，避免把本地 key 写入共享 Turso 的 `api_configs` 并影响真实用户默认配置；生产环境必须忽略该 fallback。
      - Flutter Web canvas 渲染使浏览器文本 locator 不稳定，UI harness 依赖固定移动视口坐标和截图证据。

