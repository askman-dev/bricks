    change_risks:
      - 改动路由或拓扑后，消息分发链路中断。
      - 会话持久化字段升级时出现向后兼容问题。
      - channel/thread scope 的 nodeId 持久化若与当前路由状态不同步，可能导致消息投递到错误节点。
      - 消息列表滚动锚点从“底部”改为“用户消息”后，若触发条件错误会导致上下文定位错位。
      - 长文本折叠状态与流式更新叠加时，可能出现按钮闪烁或展开状态丢失。
      - 菜单动画时长或曲线调整不当可能导致菜单响应突兀或视觉跳变。
      - 设计系统 token 文档与 `AppColors` / `ChatColors` 映射不一致时，后续 UI 变更可能重新引入一次性颜色或冗余组件 token。
      - 侧边栏宽度或背景色若与 chat surface 层级脱节，宽屏下会丢失导航层与主画布的视觉分离。
      - 宽屏侧边栏 resize handle 若命中区域太窄或未设为 opaque hit test，用户会以为拖拽调宽功能失效。
      - 如果抽屉式导航与宽屏内联导航共用关闭策略，点击频道可能在宽屏下误收起侧栏，或在窄屏下无法关闭全屏抽屉。
      - 发送消息后若 streaming 状态禁用 TextField，会打断连续输入工作流并丢失键盘焦点。
      - 输入框 focus 态若重新引入强边框，会破坏暗色 composer 的安静层级并制造不必要的视觉噪音。
      - 输入框底部 action 若混用不同 enabled 颜色，用户会误解部分按钮被禁用或处于不同优先级。
      - 标题区子区切换与右上角管理菜单职责若混淆，可能导致用户误触或切换不可达。
      - 频道重命名与新建时若未统一大小写/空白策略，可能出现“看似重复”名称并影响切换。
      - 异步路由（如 OpenClaw）与默认路由混用时，若排序键选错（例如把可变写入游标当作时间序）可能导致历史消息时序错乱。
      - 当多条消息 createdAt 相同且缺少 seqId/稳定并列键时，可能出现“新消息插到旧消息上方”的顺序抖动。
      - 当 writeSeq 与 seqId 语义混用，或 createdAt 来自不同时区来源时，会出现“回复跑到提问前”的错位。
      - user 气泡投递状态若未按路由类型区分（default/openclaw/其他远端），会导致状态图标误导用户。
      - 若 default `/chat/respond` 回退为同步阻塞路径，会导致“先入库再异步回复”契约失效并放大接口延迟。
      - 若 dispatch 占位与真实 assistant 正文未复用同一 `messageId`/合并链路，可能出现重复头像行或占位残留。
      - 若 dispatch 占位被渲染成普通空 assistant 气泡，用户会误判 AI 已经输出正文并干扰两段状态图标语义。
      - 若 SSE 终态消息不区分变更类型就全量刷新 topology，会把普通对话 completion 放大成多次 scopes/channels/scope-settings 请求并触发 429。
      - tool-driven UI 刷新应依赖 message metadata invalidations；新增会改变频道、线程、scope settings 或资源列表的工具时必须同步维护 invalidation mapping。
      - 若前端回退到“全量重放 upsert”，会再次引入 write_seq 噪声推进与重复写入风险。
      - channel 会话若错误暴露 thread 路由菜单，用户可能误写 thread scope 配置并造成路由预期不一致。
      - 若未按路由动态切换输入框左下角动作按钮，可能出现默认路由缺少模型入口或 OpenClaw 无法快捷注入斜杠命令的问题。
      - 长轮询 waitMs 设置过高且缺少超时保护时，可能导致连接堆积并放大服务端资源占用。
      - 内建 Agent 与自定义 Agent 合并策略若处理不当，可能导致同名覆盖异常或列表顺序不稳定。
      - 若将 `@` 提及能力从输入框迁移到路由指示后未保持可点击与菜单项一致性，用户可能误解当前路由状态或无法切换目标 Agent。
      - 若侧边栏 Skills 分组默认折叠状态或空态文案不稳定，可能与后续真实技能列表接入产生认知偏差。
      - Agent 详情页“修改配置/发起对话”回调若未正确关闭抽屉与路由跳转，可能出现重复页面栈或会话 Agent 未更新。
      - OpenClaw `@` 菜单若使用错误 nodeId 查询 agents，会导致用户引用到其他节点的 Agent 或看到空列表。
      - 设置页返回后若未刷新节点列表，聊天页路由菜单可能继续显示过期节点名称或缺少新节点。
      - 若“回到最新消息”按钮显隐阈值或滚动目标设置不当，用户可能误判已到达最新消息或无法快速回到底部。
      - 若发送追问时只依赖历史滚动标记而不是当前视野是否看到最新回复结尾，用户读旧回复时可能被强制跳走，或读完后发送无法回到新消息。
      - 若初始历史批次没有 user 消息时仍套用 user 锚点 padding，最后一段 AI/tool/status 内容会被不自然地抬高。
      - 若初始历史加载回退为全量历史而非最后 20 条，会放大长会话进入页面的渲染和滚动定位成本。
      - 如果仅从历史 scope 恢复频道列表，用户刚新建但尚未发送消息的频道会在刷新后从侧边栏消失；可见频道与 Thread 必须来自 `chat_channels` registry。
      - 若移动端没有可写的本地 Agents 目录，登录后的 chat setup 会在历史会话加载前失败，表现为同账号移动端看不到网页历史数据。
      - 若 iOS 本地路径解析依赖 `HOME` 环境变量，真机启动会在 chat setup 阶段失败并阻断历史会话加载。
      - 若本地自定义 Agent 文件读取与线上会话初始化共用同一个失败边界，单个本地文件系统异常会误伤频道和历史加载。
      - ChatHistoryApiService 依赖 AuthenticatedApiClient 注入 token；若重新在 ChatScreen 用 _authToken 阻断 load/respond/SSE，会回到 UI 静默失败路径。
      - 相邻 tool_call_start/tool_call 消息应在 MessageList 中折叠成一个 Thinking/Thinking complete 标志，并支持点击查看详情；同 task 的 tool group 应显示在 Processing 占位前；紧随其后的普通 assistant 文本会隐藏重复 header。如果分组边界跨过普通 assistant/user 消息，会错误隐藏正常对话内容。
      - agent loop 默认预算应保持 10 steps / 50 tool calls，单步模型流超时默认为 60s；当 tool calls 已发生但 final text stream 为空时，后端必须把最终 assistant row 写成带真实 stop reason 的 failed 消息，并且只有实际 timeout 路径才能标记为 timeout_reached。
      - AI tool 修改当前 channel name 或创建 thread 后，ChatScreen 需要在 SSE snapshot 后刷新 scopes/channel names/scope settings，否则顶部 channel 名与 Thread 列表会等到整页刷新后才更新。
      - Thread 自动命名必须只在非 main Thread 上运行；`manual` 名称不能被自动覆盖，`first_message_generated` 每个 Thread 只能从 `first_message_exact` 抢占一次，模型生成失败或超时时需要 fallback 完成状态，避免永久停在 attempted。
      - 若组件直接写死颜色或误用 `primary` 作为普通气泡背景，会破坏暗色信息层级并导致关键行动不突出。
      - 若频道最新消息时间未在消息加载、追加、归档时同步更新，侧边栏排序将与实际活跃时间脱节。
      - 若仅对侧边栏频道列表使用 _sortedChannels 而未对顶部频道下拉菜单同步更新，两处展示顺序不一致会混淆用户。
      - 若子区显示名只改前端内存而未保存 thread-scoped name，刷新后会回退为 threadId。
      - 顶部频道菜单的 Rename/Archive 操作必须复用频道持久化路径，且默认频道必须保持禁用，避免误改或误归档主入口。
      - 顶部频道菜单若没有最大高度约束，频道数量较多时弹层会过高并遮挡主要对话内容；应依赖 PopupMenuButton constraints 触发菜单内部滚动。
      - 若主区也暴露“当前组”改名/归档操作，可能误删频道级会话入口或造成 channel/thread scope 语义混淆。

