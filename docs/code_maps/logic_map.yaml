      - site_publish_status
      - site_build
      - site_media_copy
      - Vite
      - React
      - published_commit_sha
      - latest_publish_commit_sha
      - publish status
      - user-scoped filesystem
      - user sandbox
      - gVisor
      - runsc
      - sandbox runner
      - site_shell_exec
      - web/dist
      - jobs/build.log
      - X-Robots-Tag
      - generated site CSP
    change_risks:
      - Channel filesystem paths must include an opaque user segment and opaque channel segment under a per-user sandbox; channelId-only paths can leak or collide across users.
      - Shell/build commands must delegate to the user sandbox runner; direct host `exec` can let AI-authored scripts format or mutate the host repository.
      - Production must not use the local runner; `BRICKS_SANDBOX_RUNNER=http` should target the same-host runner, which creates per-user containers with Docker `--runtime=runsc`.
      - The sandbox runner must mount only one user's filesystem root inside the configured sandbox root; while production and preview share one database, both must pass `production,sandboxes` so commands run against the same workspace files.
      - Same-user channels intentionally share one sandbox filesystem, so privacy and deletion safety boundaries must be enforced at user level rather than channel level.
      - Workspace file tools must reject absolute paths, `..`, `.`, null bytes, empty segments, and protected `.git` or `node_modules` deletion.
      - Failed builds must never replace the previous successful `web/dist`; otherwise a bad agent edit can take down the public site.
      - Publish status is commit-based only in the current architecture; if future flows need uncommitted workspace detection, dirty-state checks must be added separately without breaking the published commit contract.
      - "`site_build` must create a git snapshot before building so `published_commit_sha` identifies the workspace tree that produced the live artifact."
      - A `succeeded` build record with a missing `web/dist/index.html` must return a controlled not-published response instead of leaking a backend 500.
      - Public slug lookup must not expose user_id or channel_id, and `craft-spaces` responses must include `X-Robots-Tag: noindex`.
      - PR preview environments should use `BRICKS_PUBLIC_SITE_BASE_URL` path URLs and Vite starter builds must use relative asset paths; otherwise generated `craft-spaces` links can fail before production wildcard origin TLS is configured or assets can resolve to the Bricks app root.
      - Generated site responses need a more permissive CSP than the Bricks app shell; otherwise user-authored apps that reference CDN scripts/styles such as Tailwind, UMD React, Babel, analytics, fonts, or media fail at runtime.
      - Host-based site serving must run before the main Flutter app SPA fallback; otherwise public site URLs can incorrectly serve the Bricks app shell.

